name: Keep analytics awake

# El plan gratis de Render duerme el servicio a los 15 minutos sin trafico y
# tarda ~1 minuto en despertar. Este cron lo visita cada 5 minutos para que la
# app (y el chequeo de acceso) encuentren el backend siempre despierto.
#
# La URL del backend no es secreta (viaja dentro del APK), asi que va escrita
# aqui. Si algun dia cambia el servicio, se cambia en este archivo; tambien se
# puede definir el secret ANALYTICS_URL, que tiene prioridad sobre el valor fijo.
#
# Nota: el repo es publico, asi que estos minutos de Actions no se cobran.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        env:
          ANALYTICS_URL: ${{ secrets.ANALYTICS_URL || 'https://openytmusic-analytics.onrender.com' }}
        run: |
          curl -fsS --max-time 30 "$ANALYTICS_URL/healthz" && echo "despierto"
