# Blueprint de Render para el backend de estadisticas de OpenYTMusic.
#
# OJO con el plan gratis (verificado en render.com/docs/free):
#   - El Postgres gratis CADUCA a los 30 dias (14 de gracia y luego lo borran
#     con todo). Antes de esa fecha corre `oymctl.py export` y guarda el JSON.
#   - El servicio web gratis se duerme a los 15 min sin trafico y tarda ~1 min
#     en despertar. Por eso el workflow .github/workflows/keepalive.yml lo
#     visita cada 5 minutos.
#
# Desplegar: Render Dashboard -> New -> Blueprint -> elegir este repo.
# (Tambien se puede crear todo por la API de Render con una API key.)

services:
  - type: web
    name: openytmusic-analytics
    runtime: python
    plan: free
    region: oregon
    rootDir: analytics
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: openytmusic-analytics-db
          property: connectionString
      # Token del CLI de administracion. Render lo genera y lo guarda.
      - key: ADMIN_TOKEN
        generateValue: true
      # Salt para hashear las IPs. Si cambia, los baneos existentes dejan de
      # coincidir (las IPs se hashean distinto): no lo cambies a la ligera.
      - key: IP_SALT
        generateValue: true
      # 0 = sin auto-baneo. Pon un numero (ej. 300) para banear solo cuando una
      # red pase ese numero de eventos en una hora.
      - key: AUTO_BAN_EVENTS_PER_HOUR
        value: "0"

databases:
  - name: openytmusic-analytics-db
    plan: free
    databaseName: oym
    user: oym
    region: oregon
